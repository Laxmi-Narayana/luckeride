spring:
  application:
    name: luckeride

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:luckeride}
    username: ${POSTGRES_USER:luckeride}
    password: ${POSTGRES_PASSWORD:luckeride}

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true