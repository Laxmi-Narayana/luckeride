services:

  # --- PostgreSQL Database for LuckeRide ---
  luckeride-db:
    image: postgres:18-alpine
    container_name: luckeride-db
    environment:
      POSTGRES_USER: luckeride
      POSTGRES_PASSWORD: luckeride
      POSTGRES_DB: luckeride
    ports:
      - "5432:5432"
    volumes:
      - luckeride_postgres_data:/var/lib/postgresql

volumes:
  luckeride_postgres_data:
